<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Popup Forms</title>

<style>

body{
    font-family: Arial, sans-serif;
    padding: 40px;
}

/* Clickable paragraph */
.open-menu{
    cursor: pointer;
    color: #0d6efd;
    font-size: 22px;
    width: fit-content;
}

/* Popup background */
.popup{
    display: none;

    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(0,0,0,0.5);

    justify-content: center;
    align-items: center;
}

/* Popup box */
.popup-content{
    background: white;
    width: 350px;
    padding: 20px;
    border-radius: 12px;
    position: relative;
}

/* Close button */
.close{
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 25px;
    cursor: pointer;
}

/* Links */
.popup-links{
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
}

.popup-links a{
    text-decoration: none;
    background: #0d6efd;
    color: white;

    padding: 14px;
    border-radius: 8px;

    display: flex;
    flex-direction: column;

    transition: 0.3s;
}

.popup-links a:hover{
    background: #084fc7;
}

.popup-links a span{
    font-size: 18px;
    font-weight: bold;
}

.popup-links a small{
    font-size: 13px;
    margin-top: 4px;
    opacity: 0.85;
}

/* Form */
form{
    display: none;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
}

input,
textarea{
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
}

button{
    padding: 12px;
    border: none;
    background: #0d6efd;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

.back-btn{
    background: #555;
}

</style>
</head>

<body>

<p class="open-menu" onclick="openPopup()">
    Categories
</p>

<!-- POPUP -->
<div class="popup" id="popup">

    <div class="popup-content">

        <span class="close" onclick="closePopup()">&times;</span>

        <!-- MENU -->
        <div id="menu">

            <h2>Quick Links</h2>

            <div class="popup-links">

                <a href="#" onclick="showForm('homeForm')">
                    <span>Home</span>
                    <small>Fill Home form</small>
                </a>

                <a href="#" onclick="showForm('educationForm')">
                    <span>Education</span>
                    <small>Fill Education form</small>
                </a>

                <a href="#" onclick="showForm('politicsForm')">
                    <span>Politics</span>
                    <small>Fill Politics form</small>
                </a>

            </div>

        </div>

        <!-- HOME FORM -->
        <form id="homeForm">

            <h2>Home Form</h2>

            <input type="text" placeholder="Your Name">

            <textarea placeholder="Write something"></textarea>

            <button type="submit">Submit</button>

            <button type="button" class="back-btn" onclick="goBack()">
                Back
            </button>

        </form>

        <!-- EDUCATION FORM -->
        <form id="educationForm">

            <h2>Education Form</h2>

            <input type="text" placeholder="School Name">

            <input type="text" placeholder="Course">

            <button type="submit">Submit</button>

            <button type="button" class="back-btn" onclick="goBack()">
                Back
            </button>

        </form>

        <!-- POLITICS FORM -->
        <form id="politicsForm">

            <h2>Politics Form</h2>

            <input type="text" placeholder="Party Name">

            <textarea placeholder="Your opinion"></textarea>

            <button type="submit">Submit</button>

            <button type="button" class="back-btn" onclick="goBack()">
                Back
            </button>

        </form>

    </div>

</div>

<script>

function openPopup(){
    document.getElementById("popup").style.display = "flex";
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}

/* Show selected form */
function showForm(formId){

    document.getElementById("menu").style.display = "none";

    document.getElementById(formId).style.display = "flex";
}

/* Go back to menu */
function goBack(){

    document.getElementById("menu").style.display = "block";

    let forms = document.querySelectorAll("form");

    forms.forEach(form => {
        form.style.display = "none";
    });
}

/* Close popup if clicking outside */
window.onclick = function(event){

    let popup = document.getElementById("popup");

    if(event.target == popup){
        popup.style.display = "none";
    }
}

</script>

</body>
</html>
